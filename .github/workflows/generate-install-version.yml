name: Generate install version

on:
  issues:
    # Creating an issue via the form applies the label and fires "labeled";
    # re-adding the label manually re-triggers the run.
    types: [labeled]

concurrency:
  group: generate-install-version
  cancel-in-progress: false

jobs:
  generate:
    if: github.event.label.name == 'generate-install-version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read and validate issue input
        id: input
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("child_process");

            // Issue-form body: "### Label\n\nvalue\n\n### Label\n\nvalue ..."
            const fields = {};
            for (const section of (context.payload.issue.body || "").split(/^### /m).slice(1)) {
              const [heading, ...rest] = section.split("\n");
              const value = rest.join("\n").trim();
              fields[heading.trim()] = value === "_No response_" ? "" : value;
            }

            const fail = async (message) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ ${message}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed",
                state_reason: "not_planned"
              });
              core.setFailed(message);
            };

            const variants = {
              "DEV Version":   { script: "Move-MacroToMethod.ps1", suffix: "abapGIT" },
              "MACRO Version": { script: "Move-MethodToMacro.ps1", suffix: "MACRO" }
            };
            const version = (fields["Version"] ?? "").trim();
            const variant = variants[version];
            if (!variant) return fail(`Version "${version}" is invalid, expected one of: ${Object.keys(variants).join(", ")}.`);

            const raw = (fields["Commit"] ?? "").trim();
            if (raw === "") return fail("Commit is mandatory but was not provided.");
            // SHA, branch or tag; reject anything git would treat as an option or path trick
            if (raw.startsWith("-") || /[\s~^:?*\[\\]|\.\./.test(raw)) return fail(`Commit "${raw}" is not a valid SHA, branch or tag name.`);

            // Branches are only available as remote-tracking refs in the checkout
            const candidates = [raw, `origin/${raw}`];
            let sha;
            for (const ref of candidates) {
              try {
                sha = execFileSync("git", ["rev-parse", "--verify", "--quiet", `${ref}^{commit}`], { encoding: "utf8" }).trim();
                break;
              } catch {}
            }
            if (!sha) return fail(`Commit "${raw}" does not exist in this repository (no matching SHA, branch or tag).`);

            const subject = execFileSync("git", ["log", "-1", "--format=%s", sha], { encoding: "utf8" }).trim();
            const message = `${subject} - ${variant.suffix}`;

            // Git refs must not contain spaces or ~^:?*[\ and no "..", so sanitize the message
            const branch = message
              .replace(/[\s~^:?*\[\]\\@{}]+/g, "-")
              .replace(/\.\.+/g, ".")
              .replace(/^[-.]+|[-.]+$/g, "")
              .replace(/\.lock$/, "");

            let exists = false;
            try {
              execFileSync("git", ["ls-remote", "--exit-code", "--heads", "origin", branch], { stdio: "ignore" });
              exists = true;
            } catch {}

            core.setOutput("sha", sha);
            core.setOutput("short", sha.slice(0, 7));
            core.setOutput("subject", subject);
            core.setOutput("version", version);
            core.setOutput("script", variant.script);
            core.setOutput("message", message);
            core.setOutput("branch", branch);
            core.setOutput("exists", String(exists));
            core.setOutput("branch_url", `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${encodeURIComponent(branch)}`);
            core.info(`Resolved commit ${sha} ("${subject}") -> ${version} on branch ${branch}${exists ? " (already exists)" : ""}`);

      - name: Create branch at commit
        if: steps.input.outputs.exists != 'true'
        env:
          SHA: ${{ steps.input.outputs.sha }}
          BRANCH: ${{ steps.input.outputs.branch }}
        run: git checkout -b "$BRANCH" "$SHA"

      - name: Run ${{ steps.input.outputs.script }}
        if: steps.input.outputs.exists != 'true'
        shell: pwsh
        env:
          SCRIPT: ${{ steps.input.outputs.script }}
        run: |
          & "./tools/$env:SCRIPT" `
            -ClassAbapPath "src/#cadaxo#cl_sqlc_cockpit_parse.clas.abap" `
            -Mapping "execute_select_via_subpool=create_dynamic_select_subpool", `
                     "execute_select_via_subpool_v_2=create_dynamic_select_subpool2", `
                     "execute_select_v_1=m_execute_select", `
                     "execute_select_v_2=m_execute_select_v_2"

      - name: Commit and push branch
        id: push
        if: steps.input.outputs.exists != 'true'
        env:
          BRANCH: ${{ steps.input.outputs.branch }}
          MESSAGE: ${{ steps.input.outputs.message }}
          SHORT: ${{ steps.input.outputs.short }}
          SCRIPT: ${{ steps.input.outputs.script }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${SCRIPT} produced no changes at commit ${SHORT}; pushing branch as-is"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "$MESSAGE"
          fi
          git push origin "$BRANCH"

      - name: Close issue
        uses: actions/github-script@v8
        env:
          SHA: ${{ steps.input.outputs.sha }}
          SUBJECT: ${{ steps.input.outputs.subject }}
          VERSION: ${{ steps.input.outputs.version }}
          SCRIPT: ${{ steps.input.outputs.script }}
          BRANCH: ${{ steps.input.outputs.branch }}
          BRANCH_URL: ${{ steps.input.outputs.branch_url }}
          EXISTS: ${{ steps.input.outputs.exists }}
          CHANGED: ${{ steps.push.outputs.changed }}
        with:
          script: |
            const { SHA, SUBJECT, VERSION, SCRIPT, BRANCH, BRANCH_URL, EXISTS, CHANGED } = process.env;
            const source = `commit \`${SHA}\` ("${SUBJECT}")`;
            let body;
            if (EXISTS === "true") {
              body = `ℹ️ ${VERSION} for ${source} already exists on branch \`${BRANCH}\`: ${BRANCH_URL}\n\nNothing was generated.`;
            } else {
              const detail = CHANGED === "true"
                ? `\`${SCRIPT}\` changes were committed.`
                : `No changes needed – \`${SCRIPT}\` found nothing to move, the branch points to the original commit.`;
              body = `✅ ${VERSION} created from ${source} on branch \`${BRANCH}\`: ${BRANCH_URL}\n\n${detail}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "completed"
            });

      - name: Report failure
        if: failure() && steps.input.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Generating the install version failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
