name: Generate code version
description: Create a DEV (abapGIT) or MACRO version branch for a specific commit
title: "[Code] Version for commit "
labels: [generate-code-version]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this issue starts a workflow that checks out the given commit, runs the
        conversion script for the selected version and pushes the result to a new branch
        `<commit message> - <suffix>`. If that branch already exists, its link is posted here.

        | Version | Script | Suffix |
        | --- | --- | --- |
        | DEV Version | `tools/Move-MacroToMethod.ps1` | `abapGIT` |
        | MACRO Version | `tools/Move-MethodToMacro.ps1` | `MACRO` |

        **Finding the commit:**
        - Browse the [commit history](https://github.com/cadaxo/SQLCockpit/commits) and use the
          copy button next to a commit to copy its SHA
        - Or list the [branches](https://github.com/cadaxo/SQLCockpit/branches) /
          [tags](https://github.com/cadaxo/SQLCockpit/tags) and enter the name instead
        - Locally: `git log --oneline -20`
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which version should be generated?
      options:
        - DEV Version
        - MACRO Version
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Commit SHA (full or abbreviated), branch name or tag that exists in this repository
      placeholder: 3f2a9c1 / main / 2025.1.4
    validations:
      required: true
